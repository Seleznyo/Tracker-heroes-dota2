services:
  app: 
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tracker-app
    env_file:
      - .env
    volumes:
      - vite_build:/var/www/html/public/build
  nginx:
    image: nginx:alpine
    container_name: tracker_nginx
    ports: 
      - "8080:80"
    volumes:
      - .:/var/www/html
      - vite_build:/var/www/html/public/build
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  postgres: 
    image: postgres:18
    container_name: tracker-postgres
    environment:
      POSTGRES_DB: tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql

volumes:
  pg_data:
  vite_build: